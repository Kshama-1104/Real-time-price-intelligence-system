services:
  - type: web
    name: price-intelligence-web
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: ALLOW_DEMO_DATA
        value: "true"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
